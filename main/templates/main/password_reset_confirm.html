{% extends 'main/base.html' %}

{% block title %}Marlia — Новий пароль{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-box">
        <h1>🔒 Новий пароль</h1>
        <p style="color:#555; margin-bottom:20px;">Введіть новий пароль для вашого акаунту</p>

        {% if messages %}
        {% for message in messages %}
        <div class="alert">{{ message }}</div>
        {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Новий пароль:</label>
                <input type="password" name="password1" placeholder="Введіть новий пароль..." required>
            </div>
            <div class="form-group">
                <label>Підтвердіть пароль:</label>
                <input type="password" name="password2" placeholder="Повторіть пароль..." required>
            </div>
            <button type="submit" class="btn">Змінити пароль</button>
        </form>
    </div>
</section>
{% endblock %}
